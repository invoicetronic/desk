name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: invoicetronic/desk

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Pin the SDK exactly as tests.yml does. Without this the publish step runs on whatever
      # SDK the runner image ships, which is not the toolchain the tests validated.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'immagine va anche sul registry privato, da cui la tira lo stack di
      # produzione. Prima veniva presa da Docker Hub: era l'unica delle sei
      # immagini dello stack a passare di li', e il pull si e' appeso otto volte
      # in cinque mesi, l'ultima bloccando il deploy automatico per tredici
      # giorni. Docker Hub resta comunque la distribuzione pubblica di desk.
      - name: Login to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      - name: Publish native binaries
        run: |
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet publish src/ -c release -r "$rid" --self-contained -p:PublishSingleFile=true -o "publish/$rid"
          done

      - name: Package binaries
        run: |
          mkdir -p artifacts
          cd publish
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            zip -j "../artifacts/desk-${rid}.zip" "$rid"/*
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/*.zip --generate-notes
