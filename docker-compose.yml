services:
  desk:
    image: invoicetronic/desk
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./desk.yml:/app/desk.yml
      - ./custom:/app/custom
      # ./data and ./logs are app-managed: use long-syntax with create_host_path
      # so docker compose creates them on first up if missing.
      - type: bind
        source: ./data
        target: /app/data       # SQLite DB persisted on host (data/desk.db)
        bind:
          create_host_path: true
      - type: bind
        source: ./logs
        target: /app/logs       # daily rolling log files
        bind:
          create_host_path: true
