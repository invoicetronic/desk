services:
  desk:
    image: invoicetronic/desk
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./desk.yml:/app/desk.yml
      - ./data:/app/data       # SQLite DB persisted on host (data/desk.db)
      - ./logs:/app/logs       # daily rolling log files
      - ./custom:/app/custom
